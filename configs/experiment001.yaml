# Experiment 001 Configuration: Arabic Professional Voice Fine-Tuning (Local Workstation)

experiment:
  id: "experiment001"
  name: "Piper ar_JO Fine-Tuning - Arabic Professional Voice"
  description: "Fine-tune ar_JO-kareem-medium using NightPrince/Arabic-professional-voice dataset on local GPU workstation"
  date: "2026-08-05"

model:
  base_model_name: "ar_JO-kareem-medium"
  base_checkpoint_hf_repo: "rhasspy/piper-checkpoints"  # HF dataset repo
  base_checkpoint_filename: "ar/ar_JO/kareem/medium/epoch=5079-step=1682020.ckpt"
  language: "ar_JO"
  sample_rate: 22050
  num_mels: 80
  length_scale: 1.0
  phoneme_type: "espeak"
  phoneme_language: "ar"

dataset:
  hf_repo: "NightPrince/Arabic-professional-voice"
  audio_format: "wav"
  target_sample_rate: 22050
  train_val_split: 0.95
  seed: 42
  text_column: "text"
  audio_column: "audio"

training:
  batch_size: 32            # Higher batch size recommended for RTX 5090 / 32GB VRAM
  learning_rate: 1.0e-4
  epochs: 50
  checkpoint_every_epochs: 5
  save_top_k: 3
  precision: "32"           # '32', '16-mixed', or 'bf16-mixed'
  grad_clip_norm: 1.0
  resume_from_checkpoint: "auto"

paths:
  data_root: "."            # Local project root directory
  datasets_dir: "datasets/experiment001"
  processed_dir: "processed/experiment001"
  checkpoints_dir: "checkpoints/experiment001"
  tensorboard_dir: "tensorboard/experiment001"
  outputs_dir: "outputs/experiment001"
  metrics_dir: "metrics/experiment001"
