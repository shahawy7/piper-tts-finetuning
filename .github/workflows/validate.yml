name: Validate Repository

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Validate Python Scripts Syntax
        run: |
          python -m py_compile scripts/*.py

      - name: Validate YAML Configurations
        run: |
          python -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('configs/*.yaml')]"

      - name: Validate Notebook JSON Formats
        run: |
          python -c "import json, glob; [json.load(open(f)) for f in glob.glob('notebooks/*.ipynb')]"
